
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#08111f">
<title>GOLD AI TRADER — Screenshot Analysis</title>
<style>
:root{
  --bg:#07101c;--panel:#101c2c;--line:#293b52;
  --text:#edf4ff;--muted:#9aabc0;--gold:#f3c65b;
  --green:#36d399;--red:#ff6878;--blue:#70a9ff;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);
font-family:Arial,Helvetica,sans-serif}
header{padding:20px 15px;background:linear-gradient(135deg,#172d49,#091321);
border-bottom:1px solid var(--line)}
.wrap{max-width:850px;margin:auto}
.brand{font-size:25px;font-weight:900;letter-spacing:.5px}
.brand span{color:var(--gold)}
.sub{font-size:12px;color:var(--muted);margin-top:6px;line-height:1.6}
main{max-width:850px;margin:auto;padding:13px}
.card{background:var(--panel);border:1px solid var(--line);
border-radius:15px;padding:15px;margin-bottom:13px}
h2{font-size:16px;margin:0 0 12px}
p{font-size:13px;line-height:1.7;color:var(--muted)}
label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px}
input,select,textarea{width:100%;padding:12px;border-radius:9px;
border:1px solid var(--line);background:#091422;color:var(--text);
font-size:14px;outline:none}
input[type=file]{padding:10px;font-size:12px}
textarea{min-height:75px;resize:vertical}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.field{margin-bottom:13px}
.btn{width:100%;border:0;border-radius:10px;padding:13px;
font-size:14px;font-weight:800;cursor:pointer;margin-top:7px}
.primary{background:var(--gold);color:#171307}
.secondary{background:#1d3553;color:#fff;border:1px solid #38516f}
.danger{background:#3b202b;color:#ffdce1;border:1px solid #743747}
.preview{display:none;width:100%;max-height:420px;object-fit:contain;
background:#050a12;border:1px solid var(--line);border-radius:10px;margin-top:10px}
.filemeta{font-size:11px;color:var(--muted);margin-top:6px;overflow-wrap:anywhere}
.pill{display:inline-block;border:1px solid var(--line);padding:5px 9px;
border-radius:20px;font-size:11px;color:var(--gold);margin-bottom:10px}
.notice{border-left:3px solid var(--gold);padding:10px 12px;
background:#1b1b19;border-radius:5px;font-size:12px;line-height:1.7;color:#e6d9b2}
#clock{font-weight:800;color:var(--green);font-size:18px}
#output{min-height:180px;font-size:12px;line-height:1.6}
footer
